# Quality gate: lint → typecheck → unit+coverage → build on every PR and push
# to main. The job name "CI" is the required status check on main
# (scripts/protect-main.mjs).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # main'e hızlı üst üste push'ta kanarya build'i iptal etme; yalnız PR dalları.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-latest
    # Lighthouse/chrome adımları askıda kalırsa runner'ı bloklamasın.
    timeout-minutes: 30
    env:
      # Content fetches at build time need project access (access control
      # blocks anonymous reads). Viewer-role token, repo secret.
      SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + coverage thresholds
        run: pnpm test
      - name: Build
        run: pnpm build
      # PRF-4: bound the client bundle (Next 16 framework floor ≈165KB gzip
      # documented in apps/web/scripts/bundle-budget.mjs) and keep every "use
      # client" surface reviewed.
      - name: Bundle budget + use-client audit
        run: pnpm --filter @dentaliva/web test:bundle
      - name: Install Playwright chromium
        run: pnpm --filter @dentaliva/web exec playwright install --with-deps chromium
      - name: E2E form journey (mocked externals)
        run: pnpm --filter @dentaliva/web exec playwright test
      # PRF-3: Lighthouse budgets against wrangler dev (the production static-
      # assets runtime). Median of 3 samples per category; 70 is the localhost
      # floor (single-sample perf spreads 72-90 on shared CPUs). The
      # 95-per-category budget (issue #45 AC) is enforced on real preview
      # deploys once DEP-1 lands; move the threshold there.
      - name: Lighthouse budgets
        run: pnpm --filter @dentaliva/web test:perf
        env:
          LH_THRESHOLD: 70

  # INT-9: dentaliva.eu instance gate. Same code, second site: anonymous
  # build against the eu project (SANITY_READ_TOKEN_EU secret once Aaron
  # creates it), its own bundle/e2e pass. Lighthouse stays com-only until
  # the eu dataset has real content to measure.
  EU:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_ID: eu
      NEXT_PUBLIC_SITE_ID: eu
      SANITY_READ_TOKEN_EU: ${{ secrets.SANITY_READ_TOKEN_EU }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + coverage thresholds
        run: pnpm test
      - name: Build (SITE_ID=eu, per-site env runner)
        working-directory: apps/web
        run: node scripts/build-site.mjs --site eu
      - name: Bundle budget + use-client audit (eu build)
        run: pnpm --filter @dentaliva/web test:bundle
      - name: Install Playwright chromium
        run: pnpm --filter @dentaliva/web exec playwright install --with-deps chromium
      - name: "E2E (eu - static segments, headers, foreign-segment 404)"
        run: pnpm --filter @dentaliva/web exec playwright test
        env:
          SITE_ID: eu
