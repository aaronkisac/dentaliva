packages:
  - "apps/*"
  - "packages/*"
# pnpm 11: allowBuilds tek mekanizma (onlyBuiltDependencies kaldırıldı —
# docs: pnpm.io/settings/build). Script koşması gereken paketler açıkça listelenir.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  "@tailwindcss/oxide": true
# Security overrides: force patched versions of vulnerable transitive deps
# (audit gate: FND-6). Re-check on every Renovate major bump.
overrides:
  "js-yaml@>=3.0.0 <3.15.2": "^3.15.2"
  "js-yaml@4.3.2": "^5.4.2"
  "smol-toml@<=1.7.0": "^1.7.1"
  "adm-zip@<0.6.1": "^0.6.1"
